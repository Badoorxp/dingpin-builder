name: Build Dingpin APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Checkout Dingpin source
        uses: actions/checkout@v4
        with:
          repository: CxAxin/Dingpin
          ref: v2.6.7
          path: dingpin

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: dingpin
        run: flutter pub get

      - name: Build release APK
        working-directory: dingpin
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dingpin-2.6.7-APK
          path: dingpin/build/app/outputs/flutter-apk/app-release.apk
